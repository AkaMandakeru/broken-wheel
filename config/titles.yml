# Profile titles catalogue.
# Add new titles here — no database changes needed. Each key is the title's
# stable identifier (what gets stored on the user). `default: true` grants the
# title to every user automatically (now and on sign-up).
#
#   key:
#     default: true            # optional — auto-granted to all users
#     name:
#       en: "English label"
#       pt: "Rótulo em português"

rookie:
