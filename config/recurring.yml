# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  reset_weekly_challenges:
    class: ResetWeeklyChallengesJob
    queue: default
    schedule: every Sunday at 11:59pm
  # Just after midnight in the season's timezone (America/Sao_Paulo = UTC-3).
  assign_daily_challenges:
    class: AssignDailyChallengesJob
    queue: default
    schedule: every day at 3:05am
  # 9am in São Paulo. Sends each special event's reminder email once, three
  # days ahead (or on the next run, if one was missed).
  special_event_reminders:
    class: SpecialEventRemindersJob
    queue: default
    schedule: every day at 12:00pm
  aggregate_community_goals:
    class: AggregateCommunityGoalsJob
    queue: default
    schedule: every 15 minutes
  # Expired Idempotency-Key responses, dead API sessions and uploads that were
  # never attached (docs/MOBILE_API_PLAN.md §5, §7).
  api_housekeeping:
    class: ApiHousekeepingJob
    queue: default
    schedule: every day at 6:30am
