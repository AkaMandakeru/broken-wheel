production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  reset_weekly_challenges:
    class: ResetWeeklyChallengesJob
    queue: default
    schedule: every Sunday at 11:59pm
  # Just after midnight in the season's timezone (America/Sao_Paulo = UTC-3).
  assign_daily_challenges:
    class: AssignDailyChallengesJob
    queue: default
    schedule: every day at 3:05am
  aggregate_community_goals:
    class: AggregateCommunityGoalsJob
    queue: default
    schedule: every 15 minutes
