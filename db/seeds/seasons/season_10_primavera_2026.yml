# =============================================================================
# SEASON 10 — PRIMAVERA 2026
# =============================================================================
# 5 semanas em outubro; 1 Background por semana.
# Coins e XP Boost mantidos nas recompensas.
# Mantidos também os desafios monthly, elite e special.
# =============================================================================

key: season_10_primavera_2026
name: Season 10 — Primavera
slogan: Floresça em movimento.
description: Uma temporada especial de primavera durante todo o mês de outubro, com
  desafios semanais de corrida e uma celebração especial do Dia das Crianças.
theme: spring
status: upcoming
starts_at: '2026-10-01'
ends_at: '2026-10-31'
time_zone: America/Sao_Paulo
xp_multiplier: 1.0
max_level: 10
top_level_xp: 13000
curve_exponent: 1.5

# Um background de perfil é um cosmético de kind `banner` — é assim que o app
# chama a imagem de fundo do cartão de perfil. `renderable` fica no padrão
# (true): um background que não pode ser equipado não serve de recompensa.
cosmetics:
- key: s10_first_blossoms_background
  kind: banner
  name: Background · Primeiros Brotos
  rarity: common
- key: s10_new_paths_background
  kind: banner
  name: Background · Novos Caminhos
  rarity: common
- key: s10_childrens_day_background
  kind: banner
  name: Background · Dia das Crianças
  rarity: rare
- key: s10_full_bloom_background
  kind: banner
  name: Background · Em Plena Flor
  rarity: epic
- key: s10_bloom_forever_background
  kind: banner
  name: Background · Floresça Sempre
  rarity: legendary

