# Sem dailies não há o que fazer na maioria dos dias do mês, e o passe fica sem
# a maior fonte de XP. As chaves são as mesmas da Season 8, então a tradução em
# pt e en já existe em config/locales.
daily_templates:
- { key: run_3km,        metric: distance_km,            target: 3,   sport: run, weight: 3, xp_reward: 50, coin_reward: 25 }
- { key: run_5km,        metric: distance_km,            target: 5,   sport: run, weight: 2, xp_reward: 70, coin_reward: 35 }
- { key: one_activity,   metric: activity_count,         target: 1,   weight: 3, xp_reward: 40, coin_reward: 20 }
- { key: two_activities, metric: activity_count,         target: 2,   weight: 1, xp_reward: 80, coin_reward: 40 }
- { key: before_8am,     metric: start_before_hour,      target: 1,   options: { hour: 8 },  weight: 2, xp_reward: 60, coin_reward: 30, requires_start_time: true }
- { key: after_6pm,      metric: start_after_hour,       target: 1,   options: { hour: 18 }, weight: 2, xp_reward: 60, coin_reward: 30, requires_start_time: true }
- { key: beat_yesterday, metric: beat_previous_day,      target: 1,   weight: 2, xp_reward: 70, coin_reward: 35 }
- { key: burn_300kcal,   metric: calories,               target: 300, weight: 2, xp_reward: 60, coin_reward: 30 }
- { key: no_stopping,    metric: uninterrupted_activity, target: 1,   weight: 1, xp_reward: 70, coin_reward: 35 }
- { key: new_route,      metric: new_route,              target: 1,   weight: 1, xp_reward: 80, coin_reward: 40 }
- { key: climb_100m,     metric: elevation_gain_m,       target: 100, weight: 1, xp_reward: 60, coin_reward: 30 }
- { key: share_workout,  metric: timeline_posts,         target: 1,   weight: 1, xp_reward: 50, coin_reward: 25 }
