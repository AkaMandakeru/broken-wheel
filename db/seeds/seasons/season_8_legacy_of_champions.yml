# Season 8 — Legacy of Champions
#
# Import with: rails 'seasons:import[season_8_legacy_of_champions]'
# The importer upserts by key and never deletes, so re-running after an edit
# updates the season in place without disturbing player progress.
#
# Every challenge here is `custom` with fixed dates. A `weekly` challenge_type
# would be rolled forward and zeroed by ResetWeeklyChallengesJob, erasing each
# named week the moment it ended.

key: season_8_legacy_of_champions
name: Legacy of Champions
slogan: Every kilometer tells a story. Build your legacy.
description: >-
  Legends are not born from one great race. They are built through thousands of
  small victories. Ten levels, four weeks, and one month to build something
  that lasts.
theme: legacy
status: active
starts_at: 2026-08-01
ends_at: 2026-08-31
time_zone: America/Sao_Paulo
xp_multiplier: 1.0
# Level count is a pacing choice; top_level_xp is the difficulty. Change
# max_level freely — the curve is respread across the same XP range, so a
# 10-level season is not an easier one, just one that levels up less often.
max_level: 10
top_level_xp: 17110
curve_exponent: 1.5

# ---------------------------------------------------------------------------
# Cosmetics catalogue
#   `renderable: false` items are awarded and collected now, and become
#   equippable once their art exists — see docs/SEASON_BATTLE_PASS_PLAN.md (D2).
# ---------------------------------------------------------------------------
