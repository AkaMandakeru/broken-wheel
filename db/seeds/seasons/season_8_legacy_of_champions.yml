  - { key: frost_banner,         kind: banner,     name: Frost Banner,         rarity: rare,      css_class: "bg-gradient-to-r from-sky-900 via-cyan-800 to-slate-900" }
  - { key: animated_aurora_banner, kind: banner,   name: Aurora Banner,        rarity: legendary, css_class: "bg-gradient-to-r from-indigo-900 via-emerald-700 to-sky-800", animated: true }
  - { key: silver_frame,         kind: frame,      name: Silver Frame,         rarity: rare,      css_class: "ring-4 ring-slate-300" }
  - { key: legendary_frame,      kind: frame,      name: Legendary Frame,      rarity: legendary, css_class: "ring-4 ring-amber-400" }
  - { key: premium_frame,        kind: frame,      name: Champion Frame,       rarity: epic,      css_class: "ring-4 ring-yellow-500" }
  - { key: gold_name,            kind: name_color, name: Gold Name,            rarity: epic,      css_class: "text-amber-500" }
  - { key: frost_name,           kind: name_color, name: Frost Name,           rarity: rare,      css_class: "text-cyan-400" }
  - { key: august_legend_border, kind: border,     name: August Legend Border, rarity: legendary, css_class: "ring-4 ring-offset-2 ring-amber-400" }
  - { key: silver_shoe_trail,    kind: trail,      name: Silver Shoe Trail,    rarity: rare,      renderable: false }
  - { key: golden_shoe_trail,    kind: trail,      name: Golden Shoe Trail,    rarity: legendary, renderable: false }
  - { key: aurora_footsteps,     kind: effect,     name: Aurora Footsteps,     rarity: legendary, renderable: false, animated: true }
  - { key: golden_footsteps,     kind: effect,     name: Golden Footsteps,     rarity: legendary, renderable: false, animated: true }
