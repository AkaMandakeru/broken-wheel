# ---------------------------------------------------------------------------
# Legacy Missions — five values, one rare reward
# ---------------------------------------------------------------------------
legacy_missions:
  - { key: discipline, metric: activity_count,    target: 10, xp_reward: 400, coin_reward: 150, fragment_reward: 10, icon: "fa-solid fa-list-check" }
  - { key: courage,    metric: personal_record,   target: 1,  xp_reward: 400, coin_reward: 150, fragment_reward: 10, icon: "fa-solid fa-bolt", options: { kind: distance } }
  - { key: resilience, metric: consecutive_days,  target: 7,  xp_reward: 400, coin_reward: 150, fragment_reward: 10, icon: "fa-solid fa-shield-heart" }
  - { key: strength,   metric: distance_km,       target: 80, xp_reward: 400, coin_reward: 150, fragment_reward: 10, icon: "fa-solid fa-dumbbell" }
  - { key: legacy,     metric: battle_pass_level, target: 10, xp_reward: 400, coin_reward: 150, fragment_reward: 10, icon: "fa-solid fa-crown" }

# ---------------------------------------------------------------------------
# Community event — the August Marathon
#   Scaled to the community rather than a fixed 10,000,000 km: an unreachable
#   bar stops motivating in week one. See plan decision D3.
# ---------------------------------------------------------------------------
community_goal:
  key: august_marathon
  metric: distance_km
  target_mode: per_participant
  per_participant: 60
  target_value: 60
  # Clearing a tier doubles the target and opens the next one, so a community
  # that finishes early keeps climbing until the season ends. Repeat tiers pay
  # coins (scaled by tier) rather than re-issuing one-time cosmetics.
  tier_coin_reward: 200
  milestones:
    - { percent: 20,  reward_key: s8_community_coins }
    - { percent: 40,  reward_key: s8_community_boost }
    - { percent: 60,  reward_key: champion_avatar }
    - { percent: 80,  reward_key: frost_banner }
    - { percent: 100, reward_key: s8_community_legend }

# ---------------------------------------------------------------------------
# Daily challenge pool — three drawn per user per day
#   "Walk 5,000 steps" and "Storm Runner" from the brief are absent: no
#   provider gives us step counts or weather. See plan decisions D4 and D5.
# ---------------------------------------------------------------------------
daily_templates:
  - { key: run_3km,        metric: distance_km,            target: 3,   sport: run, weight: 3, xp_reward: 50, coin_reward: 25 }
  - { key: run_5km,        metric: distance_km,            target: 5,   sport: run, weight: 2, xp_reward: 70, coin_reward: 35 }
  - { key: one_activity,   metric: activity_count,         target: 1,   weight: 3, xp_reward: 40, coin_reward: 20 }
  - { key: two_activities, metric: activity_count,         target: 2,   weight: 1, xp_reward: 80, coin_reward: 40 }
  - { key: before_8am,     metric: start_before_hour,      target: 1,   options: { hour: 8 },  weight: 2, xp_reward: 60, coin_reward: 30, requires_start_time: true }
  - { key: after_6pm,      metric: start_after_hour,       target: 1,   options: { hour: 18 }, weight: 2, xp_reward: 60, coin_reward: 30, requires_start_time: true }
  - { key: beat_yesterday, metric: beat_previous_day,      target: 1,   weight: 2, xp_reward: 70, coin_reward: 35 }
  - { key: burn_300kcal,   metric: calories,               target: 300, weight: 2, xp_reward: 60, coin_reward: 30 }
  - { key: no_stopping,    metric: uninterrupted_activity, target: 1,   weight: 1, xp_reward: 70, coin_reward: 35 }
  - { key: new_route,      metric: new_route,              target: 1,   weight: 1, xp_reward: 80, coin_reward: 40 }
  - { key: climb_100m,     metric: elevation_gain_m,       target: 100, weight: 1, xp_reward: 60, coin_reward: 30 }
  - { key: share_workout,  metric: timeline_posts,         target: 1,   weight: 1, xp_reward: 50, coin_reward: 25 }
