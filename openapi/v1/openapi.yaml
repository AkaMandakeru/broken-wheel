                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - authorize_url
                    - state
                    properties:
                      authorize_url:
                        type: string
                      state:
                        type: string
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: integrations are switched off
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/strava/callback":
    post:
      summary: Finish linking Strava
      tags:
      - Strava
      description: Exchanges the code on the server and starts importing the player's
        Strava history.
      parameters: []
      responses:
        '200':
          description: linked
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - provider
                    - connected
                    - athlete_id
                    - scope
                    - connected_at
                    properties:
                      provider:
                        type: string
                        enum:
                        - strava
                      connected:
                        type: boolean
                      athlete_id:
                        type: integer
                        nullable: true
                      scope:
                        type: string
                        nullable: true
                        example: read,activity:read_all
                      connected_at:
                        type: string
                        format: date-time
                        nullable: true
        '422':
          description: state is invalid, expired or someone else's
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - state
              properties:
                code:
                  type: string
                state:
                  type: string
                scope:
                  type: string
                error:
                  type: string
                  description: What Strava sent instead of a code, if the player declined
  "/api/v1/strava/activities":
    get:
      summary: Recent Strava activities to pick from
      tags:
      - Strava
      responses:
        '200':
          description: the latest activities
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - sport_type
                      - sport
                      - importable
                      - imported
                      - distance_km
                      - moving_time_seconds
                      - start_date
                      - start_date_local
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                          nullable: true
                        sport_type:
                          type: string
                          example: TrailRun
                        sport:
                          type: string
                          nullable: true
                          description: The app's sport; null when not tracked
                        importable:
                          type: boolean
                        imported:
                          type: boolean
                        distance_km:
                          type: number
                        moving_time_seconds:
                          type: integer
                        start_date:
                          type: string
                          format: date-time
                          nullable: true
                        start_date_local:
                          type: string
                          nullable: true
                          example: '2026-05-10T08:00:00'
                          description: Local wall-clock time, no zone
        '422':
          description: Strava isn't linked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: 'Strava access was revoked: link it again'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '429':
          description: Strava's rate limit
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '502':
          description: Strava is failing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/strava/import":
    post:
      summary: Import picked Strava activities
      tags:
      - Strava
      description: Runs in the background. New workouts (and their XP) show up a few
        seconds later.
      parameters:
      - "$ref": "#/components/parameters/idempotency_key"
      responses:
        '202':
          description: import queued
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - requested_count
                    properties:
                      requested_count:
                        type: integer
        '422':
          description: nothing picked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - activity_ids
              properties:
                activity_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 50
  "/api/v1/strava":
    delete:
      summary: Unlink Strava
      tags:
      - Strava
      responses:
        '204':
          description: unlinked (also when it wasn't linked)
        '401':
          description: not signed in
