  "/api/v1/devices":
    post:
      summary: Register this device for push notifications
      tags:
      - Devices
      description: Call on every launch with the Expo push token. A token already
        registered (even to another account) moves to the signed-in user.
      parameters: []
      responses:
        '201':
          description: registered
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - platform
                    - token
                    - last_seen_at
                    - created_at
                    properties:
                      id:
                        type: integer
                      platform:
                        type: string
                        enum:
                        - expo
                      token:
                        type: string
                      app_version:
                        type: string
                        nullable: true
                      locale:
                        type: string
                        nullable: true
                      last_seen_at:
                        type: string
                        format: date-time
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
        '200':
          description: already registered — moved to this account
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - platform
                    - token
                    - last_seen_at
                    - created_at
                    properties:
                      id:
                        type: integer
                      platform:
                        type: string
                        enum:
                        - expo
                      token:
                        type: string
                      app_version:
                        type: string
                        nullable: true
                      locale:
                        type: string
                        nullable: true
                      last_seen_at:
                        type: string
                        format: date-time
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
        '422':
          description: not an Expo push token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - device
              properties:
                device:
                  type: object
                  required:
                  - platform
                  - token
                  properties:
                    platform:
                      type: string
                      enum:
                      - expo
                    token:
                      type: string
                      example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
                    app_version:
                      type: string
                      example: 1.0.0
                    locale:
                      type: string
                      example: pt-BR
