      - Workouts
      parameters:
      - "$ref": "#/components/parameters/cursor"
      - "$ref": "#/components/parameters/limit"
      responses:
        '200':
          description: a page of workouts
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - sport
                      - workout_date
                      - distance_km
                      - duration
                      - pace_seconds_per_km
                      - start_time
                      - start_time_known
                      - provider
                      - external_id
                      - created_at
                      properties:
                        id:
                          type: integer
                        sport:
                          type: string
                          nullable: true
                          example: run
                        workout_date:
                          type: string
                          format: date
                          nullable: true
                        distance_km:
                          type: number
                          nullable: true
                        duration:
                          type: object
                          required:
                          - minutes
                          - moving_seconds
                          - elapsed_seconds
                          properties:
                            minutes:
                              type: integer
                              nullable: true
                            moving_seconds:
                              type: integer
                              nullable: true
                            elapsed_seconds:
                              type: integer
                              nullable: true
                        pace_seconds_per_km:
                          type: integer
                          nullable: true
                          description: Seconds per km; null without distance or time
                        start_time:
                          type: string
                          nullable: true
                          example: '07:30'
                          description: Local wall-clock time; null when unknown
                        start_time_known:
                          type: boolean
                        provider:
                          type: string
                          enum:
                          - manual
                          - strava
                        external_id:
                          type: string
                          nullable: true
                          description: The Strava activity id for imports
                        created_at:
                          type: string
                          format: date-time
                  meta:
                    type: object
                    required:
                    - next_cursor
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                      workout_count:
                        type: integer
                        description: First page only
                      unique_days:
                        type: integer
                        description: First page only
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: workouts are switched off
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Log a workout by hand
      tags:
      - Workouts
      description: 'XP is credited in the background: when `meta.xp_pending` is true,
        refetch the season in a few seconds.'
      parameters:
      - "$ref": "#/components/parameters/idempotency_key"
      responses:
        '201':
          description: workout created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - sport
                    - workout_date
                    - distance_km
                    - duration
                    - pace_seconds_per_km
                    - start_time
                    - start_time_known
                    - provider
                    - external_id
                    - created_at
                    properties:
                      id:
                        type: integer
                      sport:
                        type: string
                        nullable: true
                        example: run
                      workout_date:
                        type: string
                        format: date
                        nullable: true
                      distance_km:
                        type: number
                        nullable: true
                      duration:
                        type: object
                        required:
                        - minutes
                        - moving_seconds
                        - elapsed_seconds
                        properties:
                          minutes:
                            type: integer
                            nullable: true
                          moving_seconds:
                            type: integer
                            nullable: true
                          elapsed_seconds:
                            type: integer
                            nullable: true
                      pace_seconds_per_km:
                        type: integer
                        nullable: true
                        description: Seconds per km; null without distance or time
                      start_time:
                        type: string
                        nullable: true
                        example: '07:30'
                        description: Local wall-clock time; null when unknown
                      start_time_known:
                        type: boolean
                      provider:
                        type: string
                        enum:
                        - manual
                        - strava
                      external_id:
                        type: string
                        nullable: true
                        description: The Strava activity id for imports
                      created_at:
                        type: string
                        format: date-time
                  meta:
                    type: object
                    required:
                    - xp_pending
                    properties:
                      xp_pending:
                        type: boolean
        '422':
          description: invalid workout
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '400':
          description: no workout in the body
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - workout
              properties:
                workout:
                  type: object
                  required:
                  - sport
                  - workout_date
                  - duration_seconds
                  properties:
                    sport:
                      type: string
                      enum:
                      - run
                      - bike
                      - soccer
                    workout_date:
                      type: string
                      format: date
                    start_time:
                      type: string
                      pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                      example: '07:30'
                    distance_km:
                      type: number
                      minimum: 0
                    duration_seconds:
                      type: integer
                      minimum: 1
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Access token from /api/v1/auth/login, valid 15 minutes
  parameters:
    accept_language:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: pt-BR
    app_version:
      name: X-App-Version
      in: header
      required: false
      schema:
        type: string
        example: 1.0.0
    idempotency_key:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: "`meta.next_cursor` of the previous page"
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
  schemas:
    error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    page_meta:
      type: object
      required:
      - next_cursor
      properties:
        next_cursor:
          type: string
          nullable: true
    image:
      type: object
      nullable: true
      additionalProperties:
        type: string
    user_summary:
      type: object
      required:
      - id
      - first_name
      - last_name
      - display_name
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        nickname:
          type: string
          nullable: true
        display_name:
          type: string
        title:
          type: object
          nullable: true
          properties:
            key:
              type: string
            label:
              type: string
        avatar:
          "$ref": "#/components/schemas/image"
    session:
      type: object
      required:
      - token_type
      - access_token
      - refresh_token
      - access_token_expires_at
      - refresh_token_expires_at
      - user
      properties:
        token_type:
          type: string
          enum:
          - Bearer
        access_token:
          type: string
        refresh_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token_expires_at:
          type: string
          format: date-time
        user:
          "$ref": "#/components/schemas/user_summary"
