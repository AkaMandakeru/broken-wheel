---
openapi: 3.0.3
info:
  title: Sports Communities API
  version: v1
  description: 'Mobile API. Every success body is `{ data, meta? }`; every error is
    `{ error: { code, message, fields? } }`.'
servers:
- url: "/"
security:
- bearer: []
paths:
  "/api/v1/achievements":
    get:
      summary: Season medals, medal counts and season reward badges
      tags:
      - Achievements
      parameters:
      - "$ref": "#/components/parameters/accept_language"
      responses:
        '200':
          description: the medal shelf
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - seasons_played
                    - medals_earned
                    - fragments
                    - medal_counts
                    - seasons
                    - reward_badges
                    properties:
                      seasons_played:
                        type: integer
                      medals_earned:
                        type: integer
                      fragments:
                        type: integer
                      medal_counts:
                        type: object
                        required:
                        - bronze
                        - silver
                        - gold
                        - diamond
                        properties:
                          bronze:
                            type: integer
                          silver:
                            type: integer
                          gold:
                            type: integer
                          diamond:
                            type: integer
                      seasons:
                        type: array
                        items:
                          type: object
                          required:
                          - season
                          - level
                          - completion_percent
                          - medal_fragments
                          - medal_tier
                          - medal_label
                          - next_medal_tier
                          - fragments_to_next_medal
                          - medal_progress_percent
                          properties:
                            season:
                              type: object
                              required:
                              - id
                              - name
                              - image
                              - browsable
                              properties:
                                id:
                                  type: integer
                                key:
                                  type: string
                                  nullable: true
                                name:
                                  type: string
                                ends_at:
                                  type: string
                                  format: date-time
                                  nullable: true
                                image:
                                  "$ref": "#/components/schemas/image"
                                browsable:
                                  type: boolean
                                  description: Whether GET /api/v1/seasons/{id} opens
                                    it
                            level:
                              type: integer
                            completion_percent:
                              type: integer
                            medal_fragments:
                              type: integer
                            medal_tier:
                              type: string
                              nullable: true
                              enum:
                              - bronze
                              - silver
                              - gold
                              - diamond
                              -
                            medal_label:
                              type: string
                              nullable: true
                            next_medal_tier:
                              type: string
                              nullable: true
                              enum:
                              - bronze
                              - silver
                              - gold
                              - diamond
                              -
                            fragments_to_next_medal:
                              type: integer
                            medal_progress_percent:
                              type: integer
                      reward_badges:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                              nullable: true
                            icon:
                              type: string
                              nullable: true
                            earned_at:
                              type: string
                              format: date-time
                              nullable: true
        '403':
          description: achievements are switched off
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/auth/password":
    post:
      summary: Email a password reset link (opens the web reset page)
      tags:
      - Auth
      security: []
      parameters: []
      responses:
        '202':
          description: accepted, whether or not the email has an account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
  "/api/v1/auth/register":
    post:
      summary: Create an account and sign in
      tags:
      - Auth
      security: []
      parameters: []
      responses:
        '201':
          description: account created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/session"
        '422':
          description: invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - user
              properties:
                user:
                  type: object
                  required:
                  - first_name
                  - last_name
                  - email
                  - password
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                    nickname:
                      type: string
                    email:
                      type: string
                    password:
                      type: string
                      minLength: 6
                      maxLength: 128
                device_name:
                  type: string
                platform:
                  type: string
  "/api/v1/auth/login":
    post:
      summary: Log in with email and password
      tags:
      - Auth
      security: []
      parameters: []
      responses:
        '201':
          description: signed in
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/session"
        '401':
          description: wrong password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
                device_name:
                  type: string
                platform:
                  type: string
                  example: ios
  "/api/v1/auth/refresh":
    post:
      summary: Swap a refresh token for new tokens (rotating)
      tags:
      - Auth
      security: []
      parameters: []
      responses:
        '200':
          description: new tokens
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/session"
        '401':
          description: unknown, expired or revoked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
  "/api/v1/auth/logout":
    delete:
      summary: Log out this device
      tags:
      - Auth
      responses:
        '204':
          description: signed out
        '401':
          description: not signed in
  "/api/v1/blocks":
    get:
      summary: Players the viewer has blocked, most recent first
      tags:
      - Moderation
      parameters:
      - "$ref": "#/components/parameters/cursor"
      - "$ref": "#/components/parameters/limit"
      responses:
        '200':
          description: blocked players
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - blocked_at
                      - user
                      properties:
                        blocked_at:
                          type: string
                          format: date-time
                        user:
                          "$ref": "#/components/schemas/user_summary"
                  meta:
                    "$ref": "#/components/schemas/page_meta"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/blocks/{user_id}":
    parameters:
    - name: user_id
      in: path
      schema:
        type: integer
      required: true
    post:
      summary: Block a player (hides their posts and comments from you)
      tags:
      - Moderation
      description: Blocking someone already blocked returns the existing block with
        200.
      responses:
        '201':
          description: blocked
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - blocked_at
                    - user
                    properties:
                      blocked_at:
                        type: string
                        format: date-time
                      user:
                        "$ref": "#/components/schemas/user_summary"
        '200':
          description: already blocked
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - blocked_at
                    - user
                    properties:
                      blocked_at:
                        type: string
                        format: date-time
                      user:
                        "$ref": "#/components/schemas/user_summary"
        '422':
          description: yourself
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: no such player
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    delete:
      summary: Unblock a player
      tags:
      - Moderation
      responses:
        '204':
          description: unblocked (also when they weren't blocked)
  "/api/v1/challenges/{challenge_id}/timeline":
    parameters:
    - name: challenge_id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: The challenge's timeline, newest first (participants only)
      tags:
      - Timeline
      parameters:
      - "$ref": "#/components/parameters/cursor"
      - "$ref": "#/components/parameters/limit"
      responses:
        '200':
          description: a page of posts
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - challenge_id
                      - content
                      - created_at
                      - user
                      - mine
                      - workout
                      - images
                      - comments
                      properties:
                        id:
                          type: integer
                        challenge_id:
                          type: integer
                        content:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        user:
                          "$ref": "#/components/schemas/user_summary"
                        mine:
                          type: boolean
                        workout:
                          type: object
                          nullable: true
                          required:
                          - id
                          - sport
                          - workout_date
                          - distance_km
                          - duration_minutes
                          properties:
                            id:
                              type: integer
                            sport:
                              type: string
                              nullable: true
                            workout_date:
                              type: string
                              format: date
                              nullable: true
                            distance_km:
                              type: number
                              nullable: true
                            duration_minutes:
                              type: integer
                              nullable: true
                        images:
                          type: array
                          items:
                            type: object
                            additionalProperties:
                              type: string
                            description: original, thumb and large URLs
                        comments:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - timeline_post_id
                            - content
                            - created_at
                            - user
                            - mine
                            properties:
                              id:
                                type: integer
                              timeline_post_id:
                                type: integer
                              content:
                                type: string
                              created_at:
                                type: string
                                format: date-time
                              user:
                                "$ref": "#/components/schemas/user_summary"
                              mine:
                                type: boolean
                  meta:
                    "$ref": "#/components/schemas/page_meta"
        '403':
          description: not a participant
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: no such challenge
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Post on the timeline
      tags:
      - Timeline
      parameters:
      - "$ref": "#/components/parameters/idempotency_key"
      responses:
        '201':
          description: posted
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - challenge_id
                    - content
                    - created_at
                    - user
                    - mine
                    - workout
                    - images
                    - comments
                    properties:
                      id:
                        type: integer
                      challenge_id:
                        type: integer
                      content:
                        type: string
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                      user:
                        "$ref": "#/components/schemas/user_summary"
                      mine:
                        type: boolean
                      workout:
                        type: object
                        nullable: true
                        required:
                        - id
                        - sport
                        - workout_date
                        - distance_km
                        - duration_minutes
                        properties:
                          id:
                            type: integer
                          sport:
                            type: string
                            nullable: true
                          workout_date:
                            type: string
                            format: date
                            nullable: true
                          distance_km:
                            type: number
                            nullable: true
                          duration_minutes:
                            type: integer
                            nullable: true
                      images:
                        type: array
                        items:
                          type: object
                          additionalProperties:
                            type: string
                          description: original, thumb and large URLs
                      comments:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - timeline_post_id
                          - content
                          - created_at
                          - user
                          - mine
                          properties:
                            id:
                              type: integer
                            timeline_post_id:
                              type: integer
                            content:
                              type: string
                            created_at:
                              type: string
                              format: date-time
                            user:
                              "$ref": "#/components/schemas/user_summary"
                            mine:
                              type: boolean
        '422':
          description: empty post
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - timeline_post
              properties:
                timeline_post:
                  type: object
                  description: Needs content, images or both
                  properties:
                    content:
                      type: string
                      maxLength: 2000
                    workout_id:
                      type: integer
                      description: One of the author's own workouts
                    images:
                      type: array
                      maxItems: 6
                      items:
                        type: string
                      description: signed_ids from POST /api/v1/uploads with purpose
                        timeline_post
  "/api/v1/challenges/{challenge_id}/timeline/{timeline_post_id}/comments":
    parameters:
    - name: challenge_id
      in: path
      schema:
        type: integer
      required: true
    - name: timeline_post_id
      in: path
      schema:
        type: integer
      required: true
    post:
      summary: Comment on a post
      tags:
      - Timeline
      parameters:
      - "$ref": "#/components/parameters/idempotency_key"
      responses:
        '201':
          description: commented
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - timeline_post_id
                    - content
                    - created_at
                    - user
                    - mine
                    properties:
                      id:
                        type: integer
                      timeline_post_id:
                        type: integer
                      content:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      user:
                        "$ref": "#/components/schemas/user_summary"
                      mine:
                        type: boolean
        '422':
          description: empty comment
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: post from another challenge
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - comment
              properties:
                comment:
                  type: object
                  required:
                  - content
                  properties:
                    content:
                      type: string
                      maxLength: 1000
  "/api/v1/challenges":
    get:
      summary: Active challenges, newest first, with the viewer's participation
      tags:
      - Challenges
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - weekly
          - biweekly
          - monthly
          - annually
          - custom
          - specific_day
      responses:
        '200':
          description: filtered by type
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - title
                      - description
                      - challenge_type
                      - sport
                      - status
                      - target_value
                      - target_unit
                      - starts_at
                      - ends_at
                      - image
                      - requirements
                      - my_participation
                      properties:
                        id:
                          type: integer
                        key:
                          type: string
                          nullable: true
                        title:
                          type: string
                        description:
                          type: string
                          nullable: true
                        challenge_type:
                          type: string
                          nullable: true
                          enum:
                          - weekly
                          - biweekly
                          - monthly
                          - annually
                          - custom
                          - specific_day
                          -
                        sport:
                          type: string
                          nullable: true
                        status:
                          type: string
                          nullable: true
                        target_value:
                          type: number
                          nullable: true
                        target_unit:
                          type: string
                          nullable: true
                        starts_at:
                          type: string
                          format: date-time
                          nullable: true
                        ends_at:
                          type: string
                          format: date-time
                          nullable: true
                        image:
                          "$ref": "#/components/schemas/image"
                        requirements:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - metric
                            - comparator
                            - label
                            - target
                            - unit
                            properties:
                              id:
                                type: integer
                              metric:
                                type: string
                                example: distance_km
                              comparator:
                                type: string
                                enum:
                                - gte
                                - lte
                              label:
                                type: string
                                example: Run 50 km
                              target:
                                type: number
                              unit:
                                type: string
                                nullable: true
                        my_participation:
                          type: object
                          nullable: true
                          required:
                          - id
                          - season_id
                          - progress_value
                          - percent_complete
                          - completed
                          - completed_at
                          - joined_at
                          - requirements
                          properties:
                            id:
                              type: integer
                            season_id:
                              type: integer
                              nullable: true
                              description: Null for a challenge joined outside any
                                season
                            progress_value:
                              type: number
                            percent_complete:
                              type: integer
                              minimum: 0
                              maximum: 100
                            completed:
                              type: boolean
                            completed_at:
                              type: string
                              format: date-time
                              nullable: true
                            joined_at:
                              type: string
                              format: date-time
                            requirements:
                              type: array
                              items:
                                type: object
                                required:
                                - requirement_id
                                - value
                                - percent
                                - met
                                properties:
                                  requirement_id:
                                    type: integer
                                  value:
                                    type: number
                                    nullable: true
                                  percent:
                                    type: integer
                                  met:
                                    type: boolean
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: challenges are switched off
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/challenges/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: 'One challenge: requirements, the viewer''s progress and the ranking'
      tags:
      - Challenges
      responses:
        '200':
          description: the challenge
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - title
                    - description
                    - challenge_type
                    - sport
                    - status
                    - target_value
                    - target_unit
                    - starts_at
                    - ends_at
                    - image
                    - requirements
                    - my_participation
                    - season
                    - ranking
                    properties:
                      id:
                        type: integer
                      key:
                        type: string
                        nullable: true
                      title:
                        type: string
                      description:
                        type: string
                        nullable: true
                      challenge_type:
                        type: string
                        nullable: true
                        enum:
                        - weekly
                        - biweekly
                        - monthly
                        - annually
                        - custom
                        - specific_day
                        -
                      sport:
                        type: string
                        nullable: true
                      status:
                        type: string
                        nullable: true
                      target_value:
                        type: number
                        nullable: true
                      target_unit:
                        type: string
                        nullable: true
                      starts_at:
                        type: string
                        format: date-time
                        nullable: true
                      ends_at:
                        type: string
                        format: date-time
                        nullable: true
                      image:
                        "$ref": "#/components/schemas/image"
                      requirements:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - metric
                          - comparator
                          - label
                          - target
                          - unit
                          properties:
                            id:
                              type: integer
                            metric:
                              type: string
                              example: distance_km
                            comparator:
                              type: string
                              enum:
                              - gte
                              - lte
                            label:
                              type: string
                              example: Run 50 km
                            target:
                              type: number
                            unit:
                              type: string
                              nullable: true
                      my_participation:
                        type: object
                        nullable: true
                        required:
                        - id
                        - season_id
                        - progress_value
                        - percent_complete
                        - completed
                        - completed_at
                        - joined_at
                        - requirements
                        properties:
                          id:
                            type: integer
                          season_id:
                            type: integer
                            nullable: true
                            description: Null for a challenge joined outside any season
                          progress_value:
                            type: number
                          percent_complete:
                            type: integer
                            minimum: 0
                            maximum: 100
                          completed:
                            type: boolean
                          completed_at:
                            type: string
                            format: date-time
                            nullable: true
                          joined_at:
                            type: string
                            format: date-time
                          requirements:
                            type: array
                            items:
                              type: object
                              required:
                              - requirement_id
                              - value
                              - percent
                              - met
                              properties:
                                requirement_id:
                                  type: integer
                                value:
                                  type: number
                                  nullable: true
                                percent:
                                  type: integer
                                met:
                                  type: boolean
                      season:
                        type: object
                        nullable: true
                        required:
                        - id
                        - name
                        description: The active season the progress and ranking are
                          read in; null for a standalone challenge
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                      ranking:
                        type: array
                        items:
                          type: object
                          required:
                          - rank
                          - user
                          - progress_value
                          - percent_complete
                          - completed
                          - me
                          properties:
                            rank:
                              type: integer
                            user:
                              "$ref": "#/components/schemas/user_summary"
                            progress_value:
                              type: number
                            percent_complete:
                              type: integer
                            completed:
                              type: boolean
                            me:
                              type: boolean
        '404':
          description: no such challenge
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/challenges/{id}/join":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    post:
      summary: Join a challenge
      tags:
      - Challenges
      parameters:
